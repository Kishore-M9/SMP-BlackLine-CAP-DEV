_schema-version: "3.3"
ID: BlackLine_Cap
version: 1.0.0
description: "BlackLine CAP Service"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # ---------------------------------------------------------
  # CAP SERVICE
  # ---------------------------------------------------------
  - name: BlackLine_Cap-srv
    type: nodejs
    path: gen/srv

    parameters:
      instances: 1
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: BlackLine_Cap-auth
      - name: Sap_smphi_postgresql
      - name: BlackLine_Cap-connectivity
      - name: BlackLine_Cap-destination


  # ---------------------------------------------------------
  # APPLICATION ROUTER
  # ---------------------------------------------------------
  - name: BlackLine_Cap
    type: approuter.nodejs
    path: app/router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    requires:

      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      - name: BlackLine_Cap-auth

      - name: BlackLine_Cap-destination

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}


# =========================================================
# RESOURCES
# =========================================================

resources:

  # ---------------------------------------------------------
  # XSUAA
  # ---------------------------------------------------------
  - name: BlackLine_Cap-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

      config:
        xsappname: BlackLine_Cap-${org}-${space}
        tenant-mode: dedicated

        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

          redirect-uris:
            - https://*~{app-api/app-uri}/**

    requires:
      - name: app-api


  # ---------------------------------------------------------
  # EXISTING POSTGRESQL SERVICE
  # ---------------------------------------------------------
  - name: Sap_smphi_postgresql
    type: org.cloudfoundry.existing-service


  # ---------------------------------------------------------
  # CONNECTIVITY
  # ---------------------------------------------------------
  - name: BlackLine_Cap-connectivity
    type: org.cloudfoundry.managed-service

    parameters:
      service: connectivity
      service-plan: lite


  # ---------------------------------------------------------
  # DESTINATION
  # ---------------------------------------------------------
  - name: BlackLine_Cap-destination
    type: org.cloudfoundry.managed-service

    parameters:
      service: destination
      service-plan: lite